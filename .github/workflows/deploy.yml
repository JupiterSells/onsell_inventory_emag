name: Build eMAG API

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # The gate. These services hold no credentials of their own and pick their
  # database from a header, so the way they break is a type that stopped
  # lining up — and an image that fails to start is shipped to every tenant
  # by `promote` without anybody looking at it. There is no test suite here
  # to run; this is the cheapest check that is not nothing.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}
      - run: doctl registry login
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            registry.digitalocean.com/kstock/emag:latest
            registry.digitalocean.com/kstock/emag:${{ github.sha }}
          cache-from: type=registry,ref=registry.digitalocean.com/kstock/emag:buildcache
          cache-to: type=registry,ref=registry.digitalocean.com/kstock/emag:buildcache,mode=max
